
name: Android Build

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          android sdk install platform-tools
          android sdk install platforms/android-35
          android sdk install build-tools/35.0.0
          android sdk install ndk/30.0.16248370

      - name: Install dependencies
        run: npm ci

      - name: Initialize Android project
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            npx tauri android init
          fi
      
      - name: Configure APK signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_DIR="src-tauri/gen/android"
          KEYSTORE_PATH="$RUNNER_TEMP/android-release.jks"
          GRADLE_FILE="$ANDROID_DIR/app/build.gradle.kts"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          {
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "storeFile=$KEYSTORE_PATH"
          } > "$ANDROID_DIR/keystore.properties"

          python3 <<'PY'
          from pathlib import Path

          path = Path("src-tauri/gen/android/app/build.gradle.kts")
          text = path.read_text()

          imports = "import java.util.Properties\n\n"
          if "import java.util.Properties" not in text:
              text = imports + text

          text = text.replace(
              "val props = java.util.Properties()",
              "val props = Properties()",
          )

          path.write_text(text)
          PY

      - name: Build APK
        run: npx tauri android build --apk
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: loomi-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
