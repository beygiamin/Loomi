
name: Android Build

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          android sdk install platform-tools
          android sdk install platforms/android-35
          android sdk install build-tools/35.0.0
          android sdk install ndk/27.2.12479018

      - name: Install dependencies
        run: npm ci

      - name: Initialize Tauri Android project if needed
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            npx tauri android init
          fi

      - name: Build APK
        run: npx tauri android build --apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: loomi-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
