
name: Android Build

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          android sdk install platform-tools
          android sdk install platforms/android-35
          android sdk install build-tools/35.0.0
          android sdk install ndk/30.0.16248370

      - name: Install dependencies
        run: npm ci

      - name: Initialize Android project
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            npx tauri android init
          fi
      
      - name: Configure APK signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_BASE64"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          test -n "$KEYSTORE_PASSWORD"

          ANDROID_DIR="src-tauri/gen/android"
          KEYSTORE_PATH="$RUNNER_TEMP/android-release.jks"
          GRADLE_FILE="$ANDROID_DIR/app/build.gradle.kts"

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > "$KEYSTORE_PATH"

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          {
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "storeFile=$KEYSTORE_PATH"
          } > "$ANDROID_DIR/keystore.properties"

          export GRADLE_FILE

          python3 <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["GRADLE_FILE"])
          text = path.read_text()

          if "signingConfigs {" not in text:
              text = text.replace(
                  "android {",
                  """android {
              signingConfigs {
                  create("release") {
                      val props = java.util.Properties()
                      rootProject.file("keystore.properties")
                          .inputStream().use { props.load(it) }
                      keyAlias = props["keyAlias"] as String
                      keyPassword = props["keyPassword"] as String
                      storePassword = props["storePassword"] as String
                      storeFile = file(props["storeFile"] as String)
                  }
              }
          """,
                  1,
              )

          release_marker = 'getByName("release") {'
          if release_marker in text:
              if 'signingConfig = signingConfigs.getByName("release")' not in text:
                  text = text.replace(
                      release_marker,
                      release_marker + '\n            signingConfig = signingConfigs.getByName("release")',
                      1,
                  )
          else:
              raise SystemExit(
                  "Could not find the release build type in build.gradle.kts"
              )

          path.write_text(text)
          PY

      - name: Build APK
        run: npx tauri android build --apk

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="src-tauri/gen/android/app/build/outputs/apk"
          APK="$(find "$APK_DIR" -type f -name '*.apk' \
            ! -name '*unsigned*' | head -n 1)"

          test -n "$APK"
          test -f "$APK"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: loomi-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
